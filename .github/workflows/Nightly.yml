name: Nightly

# The Test workflow says whether OMJulia works against what is released today.
# This one says what is about to break it: the OpenModelica nightly, and the
# unreleased Julia. Neither belongs on a pull request, where a red run would be
# nobody's fault and would train people to ignore it.
on:
  schedule:
    # 03:40 UTC on every third day of the month. Cron counts days rather than
    # intervals, so the gap is one day shorter across a month boundary.
    - cron: "40 3 */3 * *"
  workflow_dispatch:

jobs:
  nightly:
    # Run only on the upstream repository, to prevent spamming forks.
    if: github.repository == 'OpenModelica/OMJulia.jl'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The compiler that is about to become the release.
          - julia-version: '1.12'
            os: 'ubuntu-latest'
            omc-version: 'nightly'
          - julia-version: '1.12'
            os: 'windows-latest'
            omc-version: 'nightly'
          # And the Julia that is about to become the release.
          - julia-version: 'nightly'
            os: 'ubuntu-latest'
            omc-version: 'stable'

    steps:
      - uses: actions/checkout@v4

      - name: "Set up OpenModelica Compiler"
        uses: OpenModelica/setup-openmodelica@v1.0
        with:
          version: ${{ matrix.omc-version }}
          packages: |
            omc
          libraries: |
            'Modelica 4.1.0'

      - run: "omc --version"

      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: x64

      - name: Cache Julia
        uses: julia-actions/cache@v2

      - name: "Build OMJulia"
        uses: julia-actions/julia-buildpkg@v1

      - name: "Test OMJulia"
        uses: julia-actions/julia-runtest@v1
        with:
          # Coverage is measured by the Test workflow. Here the question is
          # only whether the tests still pass.
          coverage: false

  msl-areas:
    # Lists the MSL areas that have an Examples package, so msl-coverage
    # below can shard over them without a hand-maintained (and inevitably
    # stale) list of libraries.
    if: github.repository == 'OpenModelica/OMJulia.jl'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      areas: ${{ steps.list.outputs.areas }}
    steps:
      - uses: actions/checkout@v4

      - name: "Set up OpenModelica Compiler"
        uses: OpenModelica/setup-openmodelica@v1.0
        with:
          version: nightly
          packages: |
            omc
          libraries: |
            'Modelica 4.1.0'

      - run: "omc --version"

      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64

      - name: Cache Julia
        uses: julia-actions/cache@v2

      - name: "Build OMJulia"
        uses: julia-actions/julia-buildpkg@v1

      - name: Install regression-test dependencies
        run: julia --project=regression-tests/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: "List MSL areas with an Examples package"
        id: list
        shell: bash
        run: julia --project=regression-tests/. regression-tests/listMslAreas.jl

  msl-coverage:
    # Separate job from `nightly`: this one only reports, it does not gate.
    # A model that stops simulating against the nightly omc is exactly what
    # this workflow exists to notice, not a reason to fail the run -- see
    # regression-tests/areaCoverageReport.jl. One shard per MSL area, so one
    # area stalling does not delay or blank out the others.
    needs: msl-areas
    if: github.repository == 'OpenModelica/OMJulia.jl'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.msl-areas.outputs.areas) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Set up OpenModelica Compiler"
        uses: OpenModelica/setup-openmodelica@v1.0
        with:
          version: nightly
          packages: |
            omc
          libraries: |
            'Modelica 4.1.0'

      - run: "omc --version"

      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64

      - name: Cache Julia
        uses: julia-actions/cache@v2

      - name: "Build OMJulia"
        uses: julia-actions/julia-buildpkg@v1

      - name: Install regression-test dependencies
        run: julia --project=regression-tests/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: "Simulate Modelica.${{ matrix.area }}.Examples"
        shell: bash
        run: julia --project=regression-tests/. regression-tests/areaCoverageReport.jl "${{ matrix.area }}"

      - name: "Upload area summary"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msl-coverage-section-${{ matrix.area }}
          path: regression-tests/temp/section-${{ matrix.area }}.md
          if-no-files-found: warn
          retention-days: 14

  publish-msl-coverage:
    # Folds every shard's section into docs/src/mslCoverage.md and commits it
    # back to whichever branch this run's ref is on, so the page reflects the
    # latest sweep without anyone doing that by hand. Skipped on forks by the
    # `if` above, same as the other jobs here.
    needs: [msl-areas, msl-coverage]
    if: github.repository == 'OpenModelica/OMJulia.jl'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Download area summaries"
        uses: actions/download-artifact@v4
        with:
          pattern: msl-coverage-section-*
          path: regression-tests/temp/sections
          merge-multiple: true

      - name: "Build docs/src/mslCoverage.md"
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# MSL coverage"
            echo
            echo "Generated by [Nightly run $GITHUB_RUN_ID](https://github.com/OpenModelica/OMJulia.jl/actions/runs/$GITHUB_RUN_ID) against the nightly omc build, on $(date -u +%Y-%m-%d)."
            echo
            echo "Which model simulates through OMJulia is a moving target against an unreleased compiler -- read this as that run's snapshot, not a promise. A model marked failing is not necessarily broken: the sweep cannot tell a runnable example from a base class meant to be extended, so some entries under \`Examples\` are expected to fail this way. See [Tested application areas](index.md#Tested-application-areas) for what that means and does not mean."
            echo
            shopt -s nullglob
            files=(regression-tests/temp/sections/*.md)
            if [ ${#files[@]} -eq 0 ]; then
              echo "_No area summaries were produced by this run._"
            else
              for f in $(printf '%s\n' "${files[@]}" | sort); do
                cat "$f"
                echo
              done
            fi
          } > docs/src/mslCoverage.md

      - name: "Commit if changed"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/src/mslCoverage.md
          if git diff --cached --quiet; then
            echo "MSL coverage unchanged."
          else
            git commit -m "Update MSL coverage report (run $GITHUB_RUN_ID)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
