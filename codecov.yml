# src/lexer.jl is generated by bin/generate_lexer.jl. Its coverage measures
# Automa's state machine, not anything we wrote, and it is large enough to
# drown out the rest of src/.
ignore:
  - "src/lexer.jl"
  - "bin/**"
  - "docs/**"
  - "regression-tests/**"

coverage:
  status:
    # Coverage comes from a single job that needs a live omc. Report the
    # number, do not let it block a merge.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
